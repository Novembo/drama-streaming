name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: backend}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: drama, POSTGRES_PASSWORD: drama, POSTGRES_DB: drama_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drama" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt"}
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - name: Tests on SQLite (fast)
        run: pytest
      - name: Same tests on PostgreSQL (the production engine)
        run: pytest
        env: {TEST_DATABASE_URL: "postgresql+psycopg://drama:drama@localhost:5432/drama_test"}
      - name: Migrations apply and match the models
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
          DATABASE_URL: postgresql+psycopg://drama:drama@localhost:5432/drama_migrate
        run: |
          PGPASSWORD=drama psql -h localhost -U drama -d drama_test -c 'CREATE DATABASE drama_migrate'
          alembic upgrade head
          alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install bandit pip-audit
      - run: bandit -q -r backend/app
      - run: pip-audit -r backend/requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t drama-api:ci backend
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "drama-api:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true}

  mobile:
    runs-on: ubuntu-latest
    continue-on-error: true   # the Flutter app of this repo has never been compiled: make it blocking once green
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: if [ -d test ]; then flutter test; fi
