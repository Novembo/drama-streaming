# Local development:  docker compose up --build   (API on http://localhost:8000/docs)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drama_benin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [drama_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drama_benin"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      ENVIRONMENT: development          # explicit: the default is production (fail closed)
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/drama_benin
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef-0123456789
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  drama_pgdata:
