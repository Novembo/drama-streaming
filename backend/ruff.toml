line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the idiomatic pattern

[lint.per-file-ignores]
"tests/support.py" = ["E402"]  # environment variables must be set before `app` is imported
